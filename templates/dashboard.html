<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cascade</title>
<style>
  :root {
    --bg: #0d1117; --panel: #151b23; --panel-2: #1c232c; --line: #2a323d;
    --text: #e6edf3; --dim: #8b949e; --faint: #6e7681;
    --pending: #3d444d; --running: #d29922; --ok: #2ea043;
    --fail: #da3633; --waiting: #8957e5; --undo: #db6d28; --accent: #388bfd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex; align-items: baseline; gap: 16px;
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .5px; }
  header .tag { color: var(--faint); font-size: 12px; }
  header .live { margin-left: auto; font-size: 12px; color: var(--faint); }
  header .live.on { color: var(--ok); }

  .launch { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 18px;
            border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .launch button {
    background: #21262d; color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 12px;
  }
  .launch button:hover { border-color: var(--accent); color: #fff; }
  .launch button:disabled { opacity: .5; cursor: default; }

  main { display: grid; grid-template-columns: 290px 1fr; height: calc(100vh - 98px); }
  #runs { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .run {
    padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .run:hover { background: var(--panel-2); }
  .run.sel { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
  .run .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run .sub { color: var(--faint); font-size: 11px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  #right { display: grid; grid-template-rows: 1fr 240px; overflow: hidden; }
  #dag { overflow: auto; padding: 16px; }
  #log { border-top: 1px solid var(--line); overflow-y: auto;
         padding: 10px 14px; background: #0a0e14; font-size: 12px; }
  #log div { padding: 1px 0; color: var(--dim); }
  #log .seq { color: var(--faint); display: inline-block; width: 30px; }
  #log .ty { display: inline-block; width: 210px; }
  #log b { color: var(--text); font-weight: 600; }

  .meta { padding: 0 16px 8px; color: var(--faint); font-size: 12px; }
  .meta b { color: var(--text); font-weight: 600; }

  #approval {
    margin: 0 16px 10px; padding: 10px 12px; border-radius: 6px;
    background: rgba(137,87,229,.12); border: 1px solid var(--waiting);
  }
  #approval .q { color: var(--text); margin-bottom: 8px; }
  #approval .who { color: var(--faint); font-size: 11px; margin-bottom: 8px; }
  #approval button {
    font: inherit; font-size: 12px; padding: 4px 12px; margin-right: 6px;
    border-radius: 5px; cursor: pointer; border: 1px solid var(--line);
    background: #21262d; color: var(--text);
  }
  #approval button.yes { border-color: var(--ok); }
  #approval button.no { border-color: var(--fail); }
  #approval input {
    font: inherit; font-size: 12px; padding: 4px 8px; width: 220px;
    margin-right: 6px; border-radius: 5px;
    background: #0d1117; color: var(--text); border: 1px solid var(--line);
  }
  .empty { padding: 40px; color: var(--faint); text-align: center; }

  .node rect { transition: fill .25s, stroke .25s; }
  .node text { font-size: 12px; fill: #fff; }
  .node .st { font-size: 10px; fill: rgba(255,255,255,.75); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  .node.RUNNING rect { animation: pulse 1.1s ease-in-out infinite; }
  .node.WAITING rect { animation: pulse 2.2s ease-in-out infinite; }
</style>
</head>
<body>

<header>
  <h1>Cascade</h1>
  <span class="tag">durable, graph-triggered workflow engine</span>
  <span class="live" id="live">idle</span>
</header>

<div class="launch" id="launch"><span style="color:var(--faint)">loading workflows…</span></div>

<main>
  <div id="runs"></div>
  <div id="right">
    <div>
      <div class="meta" id="meta"></div>
      <div id="approval" hidden></div>
      <div id="dag"><div class="empty">Select a run, or launch one above.</div></div>
    </div>
    <div id="log"></div>
  </div>
</main>

<script>
const COLOR = {
  PENDING: 'var(--pending)', SCHEDULED: '#1f6feb', RUNNING: 'var(--running)',
  SUCCEEDED: 'var(--ok)', FAILED: 'var(--fail)', WAITING: 'var(--waiting)',
  COMPENSATED: 'var(--undo)', RETRY_SCHEDULED: 'var(--running)',
};
const RUN_COLOR = {
  PENDING: 'var(--pending)', RUNNING: 'var(--running)', WAITING: 'var(--waiting)',
  COMPENSATING: 'var(--undo)', SUCCEEDED: 'var(--ok)', FAILED: 'var(--fail)',
  CANCELLED: 'var(--faint)',
};

let selected = null, source = null, spec = null, ctx = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---- launch buttons ------------------------------------------------- */
async function loadWorkflows() {
  const r = await fetch('/api/workflows/');
  const data = await r.json();
  const list = data.results || data;
  const box = $('launch');
  box.innerHTML = '';
  list.forEach(w => {
    const b = document.createElement('button');
    b.textContent = '▶ ' + w.name;
    b.onclick = () => launch(w.name, b);
    box.appendChild(b);
  });
}

async function launch(name, btn) {
  if (btn) { btn.disabled = true; setTimeout(() => btn.disabled = false, 800); }
  // rolling_cluster_upgrade needs a node; everything else takes no input.
  const body = { workflow: name };
  if (name === 'rolling_cluster_upgrade') {
    body.input = { node: 'node-' + (1 + Math.floor(Math.random() * 5)) };
    body.entity_ref = 'node:' + body.input.node;
  }
  const r = await fetch('/api/runs/', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const run = await r.json();
  await loadRuns();
  select(run.id);
}

/* ---- run list ------------------------------------------------------- */
async function loadRuns() {
  const r = await fetch('/api/runs/?limit=40');
  const data = await r.json();
  const list = data.results || data;
  const box = $('runs');
  box.innerHTML = '';
  list.forEach(run => {
    const el = document.createElement('div');
    el.className = 'run' + (run.id === selected ? ' sel' : '');
    el.onclick = () => select(run.id);
    el.innerHTML =
      `<span class="dot" style="background:${RUN_COLOR[run.status] || 'var(--pending)'}"></span>` +
      `<span class="nm">${esc(run.workflow)}` +
      `<div class="sub">${esc(run.status)}` +
      (run.entity_ref ? ' · ' + esc(run.entity_ref) : '') +
      (run.trigger_source && run.trigger_source.startsWith('trigger:') ? ' · auto' : '') +
      `</div></span>`;
    box.appendChild(el);
  });
}

/* ---- DAG layout: longest path from the roots ------------------------ */
function layout(steps) {
  const by = {}; steps.forEach(s => by[s.id] = s);
  const lvl = {};
  const depth = (id, seen = new Set()) => {
    if (lvl[id] !== undefined) return lvl[id];
    if (seen.has(id)) return 0;              // cycles are rejected at save time
    seen.add(id);
    let needs = by[id].needs || [];
    if (typeof needs === 'string') needs = [needs];
    lvl[id] = needs.length ? Math.max(...needs.map(n => depth(n, seen))) + 1 : 0;
    return lvl[id];
  };
  steps.forEach(s => depth(s.id));

  const cols = {};
  steps.forEach(s => (cols[lvl[s.id]] = cols[lvl[s.id]] || []).push(s.id));

  const W = 170, H = 52, GX = 60, GY = 22;
  const pos = {};
  Object.keys(cols).forEach(l => {
    cols[l].forEach((id, i) => {
      pos[id] = { x: 10 + l * (W + GX), y: 10 + i * (H + GY), w: W, h: H };
    });
  });
  const width = 20 + (Math.max(...Object.keys(cols).map(Number)) + 1) * (W + GX);
  const height = 20 + Math.max(...Object.values(cols).map(c => c.length)) * (H + GY);
  return { pos, width, height };
}

function renderDag() {
  if (!spec) return;
  const steps = spec.steps || [];
  const { pos, width, height } = layout(steps);
  const stepState = (ctx && ctx.steps) || {};

  let edges = '', nodes = '';
  steps.forEach(s => {
    let needs = s.needs || [];
    if (typeof needs === 'string') needs = [needs];
    needs.forEach(n => {
      const a = pos[n], b = pos[s.id];
      if (!a || !b) return;
      const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
      const mid = (x1 + x2) / 2;
      const done = (stepState[n] || {}).status === 'SUCCEEDED';
      edges += `<path d="M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}"
        fill="none" stroke="${done ? 'var(--ok)' : 'var(--line)'}" stroke-width="2"/>`;
    });
  });

  steps.forEach(s => {
    const p = pos[s.id];
    const st = (stepState[s.id] || {}).status || 'PENDING';
    const attempts = (stepState[s.id] || {}).attempts || 0;
    const label = st + (attempts > 1 ? ` · try ${attempts}` : '');
    nodes += `<g class="node ${st}">
      <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="7"
            fill="${COLOR[st] || 'var(--pending)'}" stroke="rgba(0,0,0,.35)"/>
      <text x="${p.x + 12}" y="${p.y + 22}">${esc(s.id)}</text>
      <text class="st" x="${p.x + 12}" y="${p.y + 38}">${esc(label)}</text>
    </g>`;
  });

  $('dag').innerHTML =
    `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${edges}${nodes}</svg>`;
}

/* ---- selecting a run, and streaming it ------------------------------ */
async function select(id) {
  selected = id;
  if (source) { source.close(); source = null; }
  $('log').innerHTML = '';

  const detail = await (await fetch(`/api/runs/${id}/`)).json();
  spec = detail.spec; ctx = detail.context;

  $('meta').innerHTML =
    `<b>${esc(detail.workflow)}</b> v${detail.workflow_version} · ` +
    `<b>${esc(detail.status)}</b>` +
    (detail.entity_ref ? ` · ${esc(detail.entity_ref)}` : '') +
    ` · ${esc(detail.trigger_source)}` +
    (detail.error ? `<br><span style="color:var(--fail)">${esc(detail.error)}</span>` : '');

  renderDag();
  await renderApprovals(id);
  detail.events.forEach(appendLog);
  await loadRuns();

  if (['SUCCEEDED', 'FAILED', 'CANCELLED'].includes(detail.status)) {
    setLive(false);
    return;
  }
  // An approval with no deadline emits nothing until a person acts, so there
  // is no point holding a stream open for it.
  if (detail.status === 'WAITING' && !$('approval').hidden) { setLive(false); return; }
  // Resume the stream from where the snapshot ended - the event log means a
  // client only ever needs "everything after seq N", so nothing is missed and
  // nothing arrives twice.
  openStream(id, detail.last_seq);
}

function openStream(id, since) {
  setLive(true);
  source = new EventSource(`/api/runs/${id}/stream/?since=${since || 0}`);

  source.addEventListener('run_event', async e => {
    const ev = JSON.parse(e.data);
    appendLog(ev);
    // Re-read derived state rather than folding events in the browser: the
    // server already does that, and two folds would eventually disagree.
    const d = await (await fetch(`/api/runs/${id}/`)).json();
    ctx = d.context;
    renderDag();
  });

  source.addEventListener('status', async () => { await loadRuns(); });

  source.addEventListener('done', async () => {
    source.close(); source = null;
    setLive(false);
    await select(id);
  });

  source.onerror = () => { setLive(false); };
}

/* ---- human approvals ------------------------------------------------ */
async function renderApprovals(id) {
  const box = $('approval');
  const { pending } = await (await fetch(`/api/runs/${id}/approvals/`)).json();

  if (!pending || !pending.length) { box.hidden = true; box.innerHTML = ''; return; }

  const a = pending[0];
  box.hidden = false;
  box.innerHTML =
    `<div class="q">⏸ ${esc(a.prompt)}</div>` +
    `<div class="who">step <b>${esc(a.step_id)}</b> · approvers: ${esc((a.approvers || []).join(', ') || 'anyone')}` +
    ` · ${a.deadline ? 'deadline ' + esc(a.deadline.slice(11, 19)) : 'no deadline — waits indefinitely, costing nothing'}</div>` +
    `<input id="actor" placeholder="your name" value="ops-oncall">` +
    `<button class="yes" id="yes">Approve</button>` +
    `<button class="no" id="no">Deny</button>`;

  $('yes').onclick = () => decide(id, a.step_id, 'approve');
  $('no').onclick = () => decide(id, a.step_id, 'deny');
}

async function decide(id, step_id, decision) {
  const actor = ($('actor') || {}).value || 'anonymous';
  await fetch(`/api/runs/${id}/approve/`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ step_id, decision, actor })
  });
  await select(id);   // re-read; the worker takes it from here
}

function setLive(on) {
  const el = $('live');
  el.textContent = on ? '● streaming' : 'idle';
  el.className = 'live' + (on ? ' on' : '');
}

function appendLog(ev) {
  const box = $('log');
  const d = document.createElement('div');
  let note = '';
  const p = ev.payload || {};
  if (p.error) note = ' — ' + esc(String(p.error).slice(0, 120));
  else if (p.resume_at) note = ' — until ' + esc(String(p.resume_at).slice(11, 19));
  else if (p.delay_seconds !== undefined) note = ` — retry in ${p.delay_seconds}s`;
  else if (p.reason) note = ' — ' + esc(p.reason);

  const highlight = /COMPENSAT|FAILED|TIMER/.test(ev.type);
  d.innerHTML = `<span class="seq">${ev.seq}</span>` +
                `<span class="ty">${highlight ? '<b>' + esc(ev.type) + '</b>' : esc(ev.type)}</span>` +
                esc(ev.step_id) + note;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

loadWorkflows();
loadRuns();
setInterval(loadRuns, 3000);   // catches runs started by the graph dispatcher
</script>
</body>
</html>
